<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Tarea</title>
</head>
<body>
    <h1>Nueva Tarea</h1>
    <form method="POST">
        <label>Título:</label><br>
        <input type="text" name="titulo" required><br><br>
        <label>Descripción:</label><br>
        <textarea name="descripcion" required></textarea><br><br>
        <button type="submit">Guardar</button>
        <a href="/">Cancelar</a>
    </form>
</body>
</html>
