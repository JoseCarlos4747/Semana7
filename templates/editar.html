<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarea</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Editar Producto</h1>
    <form method="POST">
        <label>Título:</label><br>
        <input type="text" name="titulo" value="{{ tarea.titulo }}" required><br><br>
        <label>Descripción:</label><br>
        <textarea name="descripcion" required>{{ tarea.descripcion }}</textarea><br><br>
        <label>
            <input type="checkbox" name="completada" {% if tarea.completada %}checked{% endif %}>
            Completada
        </label><br><br>
        <button type="submit">Actualizar</button>
        <a href="/">Cancelar</a>
    </form>
    
</body>
</html>
